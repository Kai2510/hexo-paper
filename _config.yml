
# html lang
language: zh

# main menu navigation
menu:
  Home: /
  About: /about

# stylesheets loaded in the <head>
stylesheets:

stylesheets_preload:
- https://cdn.bootcss.com/highlight.js/9.6.0/styles/github.min.css # for highlight
- https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap
- https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap

# scripts loaded in the end of the body
scripts_defer:
- https://cdn.bootcss.com/highlight.js/9.6.0/highlight.min.js # for highlight
- /js/search.js # for local search
- /js/paper.js # for basic script


social:
  #  Github: https://github.com/yours
  #  Codepen: https://codepen.io/yours
  #  Dribbble: https://dribbble.com/yours
  #  Twitter: https://twitter.com/yours

# Uncomment to disable sidebar
# toc: false
# link: false
# archives: false
# categories: false
# tags: false

# theme color
main_color: tideblue
# forest | grass | sky | sun | sea | cloud | purple | watergreen | newyear | grassgreen | tideblue

# google Analytics
google_analytics_id: xxxxx

# comment module
# engine: valine | artalk | false
comment:
  engine: valine
  valine:
    appId: your_appid_here
    appKey: your_key_here
    placeholder: '写两句吧(╹▽╹)'
    notify: true
    verify: false
    avatar: identicon
  artalk:
    server: https://artalk.your_blog
    site: 'your_blog'
    placeholder: '写两句吧(╹▽╹)'

math:
  engine: 'mathjax'
  mathjax:
    enable: true
    cdn: https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-MML-AM_CHTML
